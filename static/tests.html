<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ProofPilot physics tests</title>
<style>
  body { background: #0a0d11; color: #e8edf2; font: 14px/1.5 ui-monospace, Consolas, monospace; padding: 24px; }
  .pass { color: #5fe3a1; } .fail { color: #ff6b6b; font-weight: bold; }
  h1 { font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<h1>ProofPilot physics tests</h1>
<pre id="out">running…</pre>
<script src="/vendor/katex/katex.min.js"></script>
<script>
  const report = (m) => { document.getElementById('out').textContent = 'ERROR: ' + m; document.title = 'ERROR'; };
  window.addEventListener('error', (e) => report(`${e.message} @ ${e.filename}:${e.lineno}`));
  window.addEventListener('unhandledrejection', (e) => report(e.reason?.stack || e.reason));
</script>
<script type="module">
import { createScene } from '/js/scenes/index.js';
import { View } from '/js/render/view.js';
import { ellipticK } from '/js/physics/rk4.js';
import { compileExpr } from '/js/physics/expr.js';

const catalog = await fetch('/catalog.json').then((r) => r.json());
const lines = [];
let failures = 0;

function spec(type, over = {}, opts = {}) {
  const e = catalog[type];
  return {
    type, title: e.title, summary: '', assumptions: [], source: 'test',
    params: { ...Object.fromEntries(Object.entries(e.params).map(([k, m]) => [k, m.default])), ...over },
    options: { ...Object.fromEntries(Object.entries(e.options ?? {}).map(([k, m]) => [k, m.default])), ...opts },
  };
}
function check(name, actual, expected, relTol = 0.01) {
  const ok = actual !== undefined && actual !== null && Math.abs(actual - expected) <= relTol * Math.max(1e-6, Math.abs(expected));
  if (!ok) failures++;
  lines.push(`<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span>  ${name}: got ${actual?.toPrecision?.(6) ?? actual}, expected ${expected.toPrecision(6)} (tol ${relTol * 100}%)`);
}
function truthy(name, cond) {
  if (!cond) failures++;
  lines.push(`<span class="${cond ? 'pass' : 'fail'}">${cond ? 'PASS' : 'FAIL'}</span>  ${name}`);
}
function run(s, seconds, step = 1 / 60) { for (let t = 0; t < seconds && !s.finished; t += step) s.advance(step); return s; }
function energyDrift(s, seconds) {
  const e0 = s.energy(); const E0 = e0.KE + e0.PE;
  let worst = 0;
  for (let t = 0; t < seconds && !s.finished; t += 1 / 30) { s.advance(1 / 30); const e = s.energy(); worst = Math.max(worst, Math.abs(e.KE + e.PE - E0)); }
  return worst / Math.max(1e-9, Math.abs(E0) || 1);
}

// --- projectile
{
  const s = run(createScene(spec('projectile', { v0: 20, angle: 45 }), catalog), 10);
  check('projectile range (vacuum)', s.measured.range, 400 / 9.81, 0.002);
  check('projectile flight time', s.measured.tof, 2 * 20 * Math.SQRT1_2 / 9.81, 0.002);
  check('projectile max height', s.measured.hmax, 200 / (2 * 9.81), 0.002);
  const c = run(createScene(spec('projectile', { v0: 15, angle: 30, h0: 20 }), catalog), 20);
  const vy = 7.5, vx = 15 * Math.cos(Math.PI / 6), T = (vy + Math.sqrt(vy * vy + 2 * 9.81 * 20)) / 9.81;
  check('projectile from cliff range', c.measured.range, vx * T, 0.002);
  const d = run(createScene(spec('projectile', { v0: 30, angle: 45, drag: 0.01 }), catalog), 20);
  truthy('drag shortens range', d.measured.range < 900 / 9.81 * 0.95);
  const heavy = run(createScene(spec('projectile', { v0: 30, angle: 45, drag: 0.01, m: 10 }), catalog), 20);
  truthy('with drag, heavier ball goes further', heavy.measured.range > d.measured.range);
  check('projectile energy conserved (vacuum)', energyDrift(createScene(spec('projectile', { v0: 20, angle: 60 }), catalog), 3), 0, 1) ;
}
// --- pendulum
{
  const s = run(createScene(spec('pendulum', { L: 2, theta0: 5 }), catalog), 8);
  check('pendulum small-angle period', s.measured.T, 2 * Math.PI * Math.sqrt(2 / 9.81) * (1 + (5 * Math.PI / 180) ** 2 / 16), 0.002);
  const big = run(createScene(spec('pendulum', { L: 1, theta0: 90 }, { connector: 'rod' }), catalog), 8);
  check('pendulum exact period at 90°', big.measured.T, 4 * Math.sqrt(1 / 9.81) * ellipticK(Math.sin(Math.PI / 4)), 0.002);
  const e = energyDrift(createScene(spec('pendulum', { theta0: 60 }), catalog), 10);
  truthy(`pendulum energy drift ${e.toExponential(2)} < 1e-6`, e < 1e-6);
  const slack = run(createScene(spec('pendulum', { theta0: 150 }, { connector: 'string' }), catalog), 4);
  truthy('string at 150° goes slack', slack.slackEvents > 0);
  const rod = run(createScene(spec('pendulum', { theta0: 150 }, { connector: 'rod' }), catalog), 4);
  truthy('rod at 150° never goes slack', rod.slackEvents === 0);
}
// --- springs
{
  const s = run(createScene(spec('spring', { m: 2, k: 50, x0: 0.2 }), catalog), 8);
  check('spring period 2π√(m/k)', s.measured.T, 2 * Math.PI * Math.sqrt(2 / 50), 0.002);
  const e = energyDrift(createScene(spec('spring', { m: 1, k: 400, x0: 0.3 }), catalog), 10);
  truthy(`stiff spring energy drift ${e.toExponential(2)} < 1e-6`, e < 1e-6);
  const f = run(createScene(spec('spring', { m: 1, k: 20, x0: 0.3, mu: 0.1 }), catalog), 30);
  truthy('Coulomb friction: block sticks with |kx| ≤ μmg', f.stuck && Math.abs(20 * f.x) <= 0.1 * 9.81 + 1e-9);
  // Coulomb friction: amplitude drops by 2μmg/k each half cycle
  const ff = createScene(spec('spring', { m: 1, k: 20, x0: 0.5, mu: 0.05 }), catalog);
  let minX = Infinity; for (let i = 0; i < 400; i++) { ff.advance(1 / 400); minX = Math.min(minX, ff.x); }
  check('Coulomb friction first turning point', minX, -(0.5 - 2 * 0.05 * 9.81 / 20), 0.01);
  const v = run(createScene(spec('spring_vertical', { m: 0.5, k: 25 }), catalog), 6);
  check('vertical spring period', v.measured.T, 2 * Math.PI * Math.sqrt(0.5 / 25), 0.002);
  const vm = run(createScene(spec('spring_vertical', { m: 0.5, k: 25, g: 1.62 }), catalog), 6);
  check('vertical spring period on the Moon (same)', vm.measured.T, 2 * Math.PI * Math.sqrt(0.5 / 25), 0.002);
}
// --- incline
{
  const s = run(createScene(spec('incline', { angle: 30, mu_s: 0.3, mu_k: 0.2, d: 5 }), catalog), 10);
  const a = 9.81 * (Math.sin(Math.PI / 6) - 0.2 * Math.cos(Math.PI / 6));
  check('incline time to bottom', s.measured.t_bottom, Math.sqrt(2 * s.travel / a), 0.003);
  check('incline speed at bottom', s.measured.v_bottom, Math.sqrt(2 * a * s.travel), 0.003);
  const st = run(createScene(spec('incline', { angle: 15, mu_s: 0.3, mu_k: 0.2 }), catalog), 2);
  truthy('incline 15° with μs=0.3 does not slide', st.s === 0 && st.finished);
  const slow = run(createScene(spec('incline', { angle: 10, mu_s: 0.3, mu_k: 0.25, v0: 2 }), catalog), 10);
  const decel = 9.81 * (0.25 * Math.cos(Math.PI / 18) - Math.sin(Math.PI / 18));
  check('incline stopping distance', slow.measured.stopDistance, 4 / (2 * decel), 0.003);
}
// --- collision
{
  for (const e of [1, 0.5, 0]) {
    const s = run(createScene(spec('collision', { m1: 2, m2: 1, u1: 3, u2: -1, e }), catalog), 10, 1 / 120);
    const P0 = 2 * 3 + 1 * -1;
    check(`collision e=${e} momentum`, 2 * s.measured.v1 + 1 * s.measured.v2, P0, 1e-9);
    check(`collision e=${e} restitution`, s.measured.v2 - s.measured.v1, e * 4, 1e-6);
  }
}
// --- atwood
{
  const s = run(createScene(spec('atwood', { m1: 3, m2: 2 }), catalog), 10);
  check('atwood acceleration', s.measured.a, 9.81 / 5, 0.002);
  check('atwood tension', s.T, 2 * 3 * 2 * 9.81 / 5, 1e-9);
}
// --- cart pendulum & double pendulum: energy conservation
{
  const e = energyDrift(createScene(spec('cart_pendulum'), catalog), 15);
  truthy(`cart-pendulum energy drift ${e.toExponential(2)} < 1e-6`, e < 1e-6);
  const d = energyDrift(createScene(spec('double_pendulum'), catalog), 15);
  truthy(`double pendulum energy drift ${d.toExponential(2)} < 1e-5`, d < 1e-5);
  // small-oscillation check of normal modes: drive pure-pendulum limit with very stiff springs
  const cp = createScene(spec('cart_pendulum', { k: 300, M: 20, x0: 0, theta0: 2 }), catalog);
  const [w1, w2] = cp.modes();
  truthy('normal modes are real and ordered', w1 > 0 && w2 > w1);
  const chaos = run(createScene(spec('double_pendulum'), catalog), 25);
  truthy('ghost diverges for chaotic start', chaos.measured.diverge !== undefined);
}
// --- general track engine
const G = 9.81, D2R = Math.PI / 180;
function trackScene(over = {}, opts = {}, track = undefined) {
  const sp = spec('track', over, opts);
  if (track) sp.track = track;
  return createScene(sp, catalog);
}
function runUntil(s, cond, maxT = 30, dt = 1 / 2000) { while (!cond(s) && s.t < maxT && !s.finished) s.advance(dt); return s; }
function trackDrift(s, seconds) {
  const e0 = s.energy(), E0 = e0.KE + e0.PE;
  let worst = 0;
  for (let t = 0; t < seconds && !s.finished; t += 1 / 30) { s.advance(1 / 30); const e = s.energy(); worst = Math.max(worst, Math.abs(e.KE + e.PE - E0)); }
  return worst / Math.max(1e-9, Math.abs(E0));
}
{
  // safe expression parser
  check('expr 2sin(x) at x=1', compileExpr('2sin(x)')(1), 2 * Math.sin(1), 1e-12);
  check('expr y = 0.1x^2 - 3 at x=4', compileExpr('y = 0.1x^2 - 3')(4), -1.4, 1e-12);
  check('expr -x^2 is -(x²)', compileExpr('-x^2')(3), -9, 1e-12);
  check('expr implicit (x+1)(x-1)', compileExpr('(x+1)(x-1)')(3), 8, 1e-12);
  check('expr 2pi·cos(pi x)', compileExpr('2pi cos(pi x)')(0), 2 * Math.PI, 1e-12);
  for (const bad of ['alert(1)', 'x; 1', 'constructor', 'window.x', 'sin(x', '`x`', 'x = 2']) {
    let threw = false; try { compileExpr(bad); } catch { threw = true; }
    truthy(`expr rejects "${bad}"`, threw);
  }
  // frictionless incline: a = g sin θ
  const inc = trackScene({ theta: 30, Ls: 8, flat: 10 }, { shape: 'incline', body: 'point' });
  const d0 = 8 - inc.s0;
  runUntil(inc, (s) => s.s >= 8);
  check('track incline: time to slide 8 m (point, frictionless)', inc.t, Math.sqrt((2 * d0) / (G * 0.5)), 0.002);
  // rolling solid ball: a = (5/7) g sin θ
  const roll = trackScene({ theta: 30, Ls: 8, flat: 10, size: 0.2, mu_s: 0.8, mu_k: 0.6 }, { shape: 'incline', body: 'ball', contact: 'roll' });
  const r0 = roll.s;
  runUntil(roll, (s) => s.s >= r0 + 5);
  check('track incline: rolling ball a = 5/7 g sinθ', roll.t, Math.sqrt((2 * 5) / ((5 / 7) * G * 0.5)), 0.003);
  truthy('rolling ball stays in rolling regime', roll.regime === 'roll');
  // too little friction → skids
  const skid = trackScene({ theta: 60, Ls: 8, size: 0.2, mu_s: 0.1, mu_k: 0.08 }, { shape: 'incline', body: 'ball', contact: 'roll' });
  skid.advance(0.3);
  truthy('ball on 60° slope with μs = 0.1 skids (tan60/3.5 > μs)', skid.regime === 'slip');
  // bowl: small oscillations, point mass ≈ pendulum of length R
  const bowl = trackScene({ R: 5, x0: -0.3 }, { shape: 'bowl', body: 'point' }, { start_auto: false });
  runUntil(bowl, (s) => s.measured.T !== undefined, 20);
  const th0 = Math.asin(0.3 / 5);
  check('bowl period (point, small amplitude)', bowl.measured.T, 2 * Math.PI * Math.sqrt(5 / G) * (1 + th0 * th0 / 16), 0.003);
  // rolling ball in the bowl: T = 2π√(7(R−r)/5g)
  const bowlRoll = trackScene({ R: 5, x0: -0.3, size: 0.5, mu_s: 0.8, mu_k: 0.6 }, { shape: 'bowl', body: 'ball', contact: 'roll' }, { start_auto: false });
  runUntil(bowlRoll, (s) => s.measured.T !== undefined, 20);
  check('bowl period (rolling solid ball) 2π√(7(R−r)/5g)', bowlRoll.measured.T, 2 * Math.PI * Math.sqrt((7 * 4.75) / (5 * G)), 0.004);
  // released near the rim: N at bottom = m(v²/ρ + g), return height = start height
  const rim = trackScene({ R: 5, m: 2 }, { shape: 'bowl', body: 'point' });
  runUntil(rim, (s) => s.measured.h_turn !== undefined, 20);
  const th = rim.theory();
  check('bowl: speed at bottom = √(2gh)', rim.measured.v_bottom, th.vBottom, 0.001);
  check('bowl: N at bottom = m(v²/R + g) (not mg)', rim.measured.N_bottom, th.Nbottom, 0.002);
  check('bowl: returns to its starting height (no friction)', rim.measured.h_turn, th.drop, 0.002);
  const nb = 2 * (2 * G * th.drop / 5 + G);
  check('bowl: N at bottom analytic m(2gh/R + g)', rim.measured.N_bottom, nb, 0.002);
  // energy conservation on a sine track
  const e1 = trackDrift(trackScene({ v0: 5, e: 1 }, { shape: 'sine', body: 'ball', contact: 'slide' }), 20);
  truthy(`sine track energy drift ${e1.toExponential(2)} < 1e-6`, e1 < 1e-6);
  const e3 = trackDrift(trackScene({ v0: 3, e: 1, x0: 0.5 }, { shape: 'sine', body: 'point' }, { start_auto: false }), 20);
  truthy(`sine track with elastic end stop energy drift ${e3.toExponential(2)} < 1e-5`, e3 < 1e-5);
  const fast = runUntil(trackScene({ v0: 8 }, { shape: 'sine', body: 'ball', contact: 'slide' }), (s) => s.measured.detach_h !== undefined, 5);
  const crestSpeed = Math.sqrt(64 - 2 * G * 2), vCrit = Math.sqrt(G / (1 * (2 * Math.PI / 8) ** 2 / 1));
  truthy(`sine crest: v = ${crestSpeed.toFixed(2)} m/s > √(g/κ) ≈ ${vCrit.toFixed(2)} m/s, so the ball leaves the track`, fast.measured.detach_h !== undefined && fast.mode === 'flight');
  const e2 = trackDrift(trackScene({ R: 5, x0: -3, size: 0.6, mu_s: 0.7, mu_k: 0.5 }, { shape: 'bowl', body: 'ball', contact: 'roll' }, { start_auto: false }), 20);
  truthy(`rolling ball in bowl energy drift ${e2.toExponential(2)} < 1e-6 (static friction does no work)`, e2 < 1e-6);
  // loop-the-loop: point mass detaches where cos θ = (2 − 2h/R)/3
  const loopFall = trackScene({ H: 8, R_loop: 4, hills: 0 }, { shape: 'coaster', body: 'point' });
  runUntil(loopFall, (s) => s.measured.detach_h !== undefined || s.measured.loop, 30);
  const h = loopFall.theory().drop, cosT = (2 - 2 * h / 4) / 3;
  truthy('loop: start below 2.5R → leaves the track', loopFall.measured.loop === 'fell');
  check('loop: detach height R(1 − cos θ) with cos θ = (2 − 2h/R)/3', loopFall.measured.detach_h, 4 * (1 - cosT), 0.004);
  const loopOk = trackScene({ H: 11, R_loop: 4, hills: 0 }, { shape: 'coaster', body: 'point' });
  runUntil(loopOk, (s) => s.measured.loop, 30);
  truthy('loop: start above 2.5R → completes the loop', loopOk.measured.loop === 'completed');
  check('loop: speed at top from energy', loopOk.measured.v_top, loopOk.theory().vTop, 0.002);
  check('loop: N at top = m(v²/R − g)', loopOk.measured.N_top, 1 * (loopOk.measured.v_top ** 2 / 4 - G), 0.004);
  check('loop: minimum start height 2.5R for a point mass', loopOk.theory().hMin, 2.5 * 4, 1e-6);
  const rail = trackScene({ H: 8, R_loop: 4, hills: 0, size: 0.3 }, { shape: 'coaster', body: 'cart', rail: 'locked' });
  runUntil(rail, (s) => s.measured.loop, 30);
  truthy('rail-locked cart completes the loop even from too low', rail.measured.loop === 'completed' && rail.measured.N_top < 0);
  // kinetic friction on the flat: d = v²/(2 μ g)
  const fr = trackScene({ x0: 1, v0: 5, mu_s: 0.5, mu_k: 0.5 }, { shape: 'custom', body: 'block', ends: 'walls' }, { start_auto: false, segments: [{ kind: 'line', length: 20 }] });
  runUntil(fr, (s) => s.measured.d_stop !== undefined, 10);
  check('friction: stopping distance v²/(2μg)', fr.measured.d_stop, 25 / (2 * 0.5 * G), 0.002);
  // rim release: near the rim N → 0, so static friction cannot keep the ball rolling and it skids
  const rimRoll = trackScene({ R: 5, size: 0.6, mu_s: 0.3, mu_k: 0.2 }, { shape: 'bowl', body: 'ball', contact: 'roll' });
  rimRoll.advance(0.05);
  truthy('ball released at the rim (N ≈ 0) skids before it can roll', rimRoll.regime === 'slip');
  // static friction holds / fails on an incline
  const hold = trackScene({ theta: 20, mu_s: 0.5, mu_k: 0.4 }, { shape: 'incline', body: 'block' });
  hold.advance(2);
  truthy('static friction holds a block at 20° when μs = 0.5 > tan 20°', hold.regime === 'stick' && Math.abs(hold.s - hold.s0) < 1e-9);
  const slip = trackScene({ theta: 20, mu_s: 0.3, mu_k: 0.2 }, { shape: 'incline', body: 'block' });
  slip.advance(1);
  truthy('block at 20° slides when μs = 0.3 < tan 20°', slip.s > slip.s0 + 0.1);
  // dropped into the bowl: impacts only ever remove energy
  const drop = trackScene({ R: 5, h_drop: 2, e: 0.5 }, { shape: 'bowl', body: 'ball', contact: 'slide' });
  const E0 = drop.energy().KE + drop.energy().PE;
  let Emax = 0; for (let i = 0; i < 600; i++) { drop.advance(1 / 60); const en = drop.energy(); Emax = Math.max(Emax, en.KE + en.PE); }
  truthy('drop into bowl: free flight, then impact loses energy', drop.measured.impact_loss > 0 && Emax <= E0 * (1 + 1e-6));
  truthy('drop into bowl: ball ends up moving along the bowl', drop.mode === 'track');
  // geometry: bowl centre path length π(R − r); function tracks and bad input
  const g1 = trackScene({ R: 5, size: 1 }, { shape: 'bowl', body: 'ball' });
  check('bowl centre path length π(R − r)', g1.track.length, Math.PI * 4.5, 1e-4);
  const fn = trackScene({ xa: -6, xb: 6 }, { shape: 'function', body: 'ball' }, { expr: '2sin(x)' });
  check('function track y = 2sin(x): top of surface', fn.track.box.ymax, 2, 1e-3);
  const bad = trackScene({}, { shape: 'function', body: 'ball' }, { expr: 'sqrt(x)' });
  truthy('undefined expression (sqrt of negative x) falls back with a warning', bad.shape === 'sine' && bad.warnings.some((w) => w.includes('undefined')));
  const loopCustom = trackScene({}, { shape: 'custom', body: 'cart' }, { segments: [{ kind: 'line', length: 4 }, { kind: 'drop', height: 10, width: 14 }, { kind: 'line', length: 2 }, { kind: 'arc', radius: 3, turn: 360 }, { kind: 'line', length: 6 }] });
  truthy('custom segments with a 360° arc build a loop', loopCustom.loopRange && loopCustom.track.length > 30);
  const sine = trackScene({ v0: 8 }, { shape: 'sine', body: 'ball', contact: 'slide' });
  const qa = sine.track.at(sine.s0);
  check('sine: ball starts at the bottom of the first valley', qa.sy, -1, 1e-4);
}

// --- every scene draws without throwing, and all readouts/derived/equations/predictions work
{
  const cv = document.createElement('canvas'); cv.style.width = '800px'; cv.style.height = '500px'; document.body.appendChild(cv);
  const view = new View(cv); view.resize();
  const variants = Object.keys(catalog).map((t) => [t, spec(t)]);
  for (const shape of catalog.track.options.shape.choices) for (const body of catalog.track.options.body.choices) {
    const sp = spec('track', { v0: 3, mu_s: 0.3, mu_k: 0.2 }, { shape, body });
    if (shape === 'function') sp.track = { expr: '0.5x^2/6 + sin(x)' };
    variants.push([`track ${shape}/${body}`, sp]);
  }
  variants.push(['track dropped ball', spec('track', { h_drop: 2 }, { shape: 'bowl' })], ['track rail cart', spec('track', {}, { shape: 'coaster', body: 'cart', rail: 'locked' })]);
  for (const [type, sp] of variants) {
    try {
      const s = createScene(sp, catalog);
      view.fit(s.bounds());
      for (let i = 0; i < 20; i++) { s.advance(0.05); s.draw({ ctx: view.ctx, view, show: { forces: true, velocity: true, accel: true, components: true, labels: true, trail: true } }); }
      for (const r of s.history) for (const [k, v] of Object.entries(r)) if (typeof v === 'number' && !Number.isFinite(v) && !Number.isNaN(v)) throw new Error(`series ${k} is infinite`);
      if (s.history.some((r) => r.speed < 0)) throw new Error('speed went negative');
      s.readouts(); s.derived(); s.equations().forEach((e) => window.katex.renderToString(e.tex, { throwOnError: true })); s.predictions();
      truthy(`${type}: draw/readouts/equations OK`, true);
    } catch (err) { truthy(`${type}: ${err.message}`, false); }
  }
}

lines.unshift(failures ? `<span class="fail">${failures} FAILED</span>` : '<span class="pass">ALL TESTS PASSED</span>');
document.getElementById('out').innerHTML = lines.join('\n');
document.title = failures ? `FAIL ${failures}` : 'PASS';
</script>
</body>
</html>
